<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
:root { --bg:#13141c; --darker:#0e0e14; --fg:#a9b1d6; --bright:#c0caf5; --dim:#6b7194; --accent:#7aa2f7; --magenta:#ad8ee6; --green:#9ece6a; }
* { box-sizing: border-box; margin: 0; }
body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); font-family: Geist, sans-serif; color: var(--fg); position: relative; }
.glow { position: absolute; inset: 0; background:
  radial-gradient(ellipse 700px 520px at 92% 18%, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%),
  radial-gradient(ellipse 620px 480px at 80% 105%, color-mix(in srgb, var(--magenta) 24%, transparent), transparent 70%),
  radial-gradient(ellipse 520px 420px at 0% 0%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%); }
.left { position: absolute; left: 72px; top: 64px; bottom: 60px; width: 520px; display: flex; flex-direction: column; }
.lock { display: flex; align-items: center; gap: 12px; font: 600 26px "JetBrains Mono", monospace; color: var(--bright); }
.lock svg { width: 34px; height: 34px; fill: var(--accent); }
h1 { margin-top: 54px; font-size: 66px; line-height: .98; letter-spacing: -.045em; font-weight: 600; color: var(--bright); }
p { margin-top: 26px; font-size: 23px; line-height: 1.42; color: var(--dim); max-width: 470px; letter-spacing: -.005em; }
.foot { margin-top: auto; display: grid; gap: 12px; }
.sw { display: flex; gap: 5px; align-items: center; }
.sw i { width: 16px; height: 16px; display: block; }
.cap { font: 500 13px "JetBrains Mono", monospace; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.url { margin-top: 14px; font: 600 21px "JetBrains Mono", monospace; color: var(--accent); }
.win { position: absolute; left: 640px; top: 92px; width: 880px; border: 1px solid var(--accent); box-shadow: 0 30px 80px rgb(0 0 0 / .55); overflow: hidden; background: #1a1b26; }
.win img { display: block; width: 1240px; margin: 0; transform-origin: 0 0; }
.win .crop { width: 880px; height: 600px; overflow: hidden; }
.win .crop img { width: 1300px; }
</style></head><body>
<div class="glow"></div>
<div class="left">
  <div class="lock"><svg viewBox="0 0 24 24"><path d="M1 8 H6 V18 H16 V23 H1 Z M8 1 H23 V16 H18 V6 H8 Z M9 9 H15 V15 H9 Z"/></svg>omaseed</div>
  <h1>Torrents, finally at home on Omarchy.</h1>
  <p>A native client for one server or many. Your theme, your keys, your seeding history.</p>
  <div class="foot">
    <div class="cap">every bundled Omarchy theme, live</div><div class="sw" id="sw"></div>
    <div class="url">omaseed.app</div>
  </div>
</div>
<div class="win"><div class="crop"><img src="seed.png" alt=""></div></div>
<script>
const A = ["#89b4fa","#1e66f5","#7d82d9","#7fbbb3","#205ea6","#7daea3","#82fb9c","#dcd7ba","#b59790","#8bc9eb","#3264eb","#e68e0d","#78824b","#81a1c1","#509475","#faa968","#f38d70","#56949f","#798186","#7aa2f7","#8d8d8d","#6e6e6e"];
document.getElementById("sw").innerHTML = A.map(c => `<i style="background:${c}"></i>`).join("");
</script>
</body></html>
